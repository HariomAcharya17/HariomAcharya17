<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Animated developer orbit">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="340" rx="28" fill="url(#background)"/>
  <g opacity=".17" stroke="#93c5fd"><path d="M0 290H1000M0 220H1000M0 150H1000M0 80H1000"/><path d="M100 0V340M250 0V340M400 0V340M550 0V340M700 0V340M850 0V340"/></g>
  <text x="500" y="52" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="5">BUILD · LEARN · SHIP</text>
  <g transform="translate(500 190)">
    <ellipse rx="315" ry="92" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".45" transform="rotate(-15)"/>
    <ellipse rx="230" ry="66" fill="none" stroke="#c084fc" stroke-width="2" opacity=".5" transform="rotate(26)"/>
    <ellipse rx="145" ry="42" fill="none" stroke="#f472b6" stroke-width="2" opacity=".55" transform="rotate(-38)"/>
    <circle r="48" fill="url(#core)" filter="url(#glow)"><animate attributeName="r" values="44;52;44" dur="2.6s" repeatCount="indefinite"/></circle>
    <text y="7" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="700">CODE</text>
    <circle cx="315" cy="0" r="10" fill="#38bdf8" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="0" r="9" fill="#c084fc" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="145" cy="0" r="8" fill="#f472b6" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16" font-weight="700"><text x="108" y="298">Frontend</text><text x="735" y="298">Backend</text><text x="98" y="105">AI / ML</text><text x="804" y="105">Cloud</text></g>
</svg>
