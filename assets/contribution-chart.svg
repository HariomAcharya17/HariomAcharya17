<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hariom's GitHub Growth</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #0b0e14;
    --card: #11151c;
    --card-border: #1e2530;
    --text: #e6edf3;
    --muted: #7d8590;
    --marker: #f2cc60;
    --grid: #1c2330;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(88,166,255,0.06), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(163,113,247,0.06), transparent 40%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 16px;
    font-family:'JetBrains Mono', monospace;
    color:var(--text);
  }

  .card{
    width:100%;
    max-width: 960px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap:7px;
    padding:12px 16px;
    border-bottom:1px solid var(--card-border);
    background: linear-gradient(180deg, #12171f, #0f131a);
  }
  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#ff5f57; }
  .dot.y{ background:#febc2e; }
  .dot.g{ background:#28c840; }
  .titlebar span{
    margin-left:10px;
    color:var(--muted);
    font-size:12px;
    letter-spacing:0.3px;
  }

  .body{ padding: 22px 26px 10px; }

  .scrawl{
    font-family:'Caveat', cursive;
    color:var(--marker);
    font-size: 30px;
    line-height:1.25;
    transform: rotate(-1deg);
    margin: 2px 0 4px 2px;
  }

  .headrow{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom: 14px;
  }
  .headrow h1{
    font-size:15px;
    font-weight:600;
    margin:0;
    color:var(--text);
  }
  .headrow .total{
    font-size:14px;
    color:var(--muted);
  }
  .headrow .total b{
    color:var(--text);
    font-size:18px;
  }

  .chartwrap{ position:relative; }
  svg{ width:100%; height:auto; display:block; }

  .tick{ font-size:11px; fill:var(--muted); font-family:'JetBrains Mono', monospace; }
  .gridline{ stroke:var(--grid); stroke-width:1; }

  #tooltip{
    position:absolute;
    pointer-events:none;
    background:#1a2029;
    border:1px solid #2a3341;
    border-radius:8px;
    padding:9px 12px;
    font-size:12px;
    line-height:1.5;
    color:var(--text);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity:0;
    transition: opacity 0.1s ease;
    white-space:nowrap;
    z-index:5;
  }
  #tooltip .d{ color:var(--muted); font-size:11px; }
  #tooltip .n{ font-weight:600; }

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    padding: 4px 4px 20px;
    font-size:11.5px;
    color:var(--muted);
  }
  .legend .sw{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .legend .sw i{
    width:9px; height:9px; border-radius:50%;
    display:inline-block;
  }

  .footer{
    padding: 12px 26px 20px;
    color: var(--muted);
    font-size: 11.5px;
    border-top: 1px solid var(--card-border);
  }
  .footer a{ color:#58a6ff; text-decoration:none; }
</style>
</head>
<body>

<div class="card">
  <div class="titlebar">
    <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
    <span>hariom@github ~ contributions</span>
  </div>

  <div class="body">
    <div class="scrawl" id="scrawlText">loading a witty remark...</div>

    <div class="headrow">
      <h1>Real contribution growth · Jan 2025 &mdash; Sep 2026</h1>
      <div class="total">total commits & activity &nbsp;<b id="totalNum">0</b></div>
    </div>

    <div class="chartwrap">
      <svg id="chart" viewBox="0 0 980 380" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="tooltip"></div>
    </div>

    <div class="legend" id="legend"></div>
  </div>

  <div class="footer">
    Pulled from Hariom's live public GitHub contribution calendar (day-level, real data). Hover the line for exact date &amp; commit count.
  </div>
</div>

<script>
