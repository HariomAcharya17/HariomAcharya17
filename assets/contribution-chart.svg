<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for lines -->
    <linearGradient id="grad2023" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="grad2024" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="grad2025" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="grad2026" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.8" />
    </linearGradient>

    <!-- Filter for shadow effect -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>

  <!-- Title -->
  <text x="60" y="45" font-size="32" font-weight="bold" fill="#1f2937">Hariom's GitHub contribution growth</text>

  <!-- Total contributions badge -->
  <g filter="url(#shadow)">
    <rect x="1020" y="15" width="140" height="50" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.5" rx="8"/>
    <text x="1090" y="40" font-size="20" font-weight="bold" fill="#dc2626" text-anchor="middle">1,504</text>
    <text x="1090" y="56" font-size="12" fill="#991b1b" text-anchor="middle">total</text>
  </g>

  <!-- Grid lines (horizontal) -->
  <line x1="80" y1="500" x2="1150" y2="500" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="400" x2="1150" y2="400" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="300" x2="1150" y2="300" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="200" x2="1150" y2="200" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="80" y1="100" x2="1150" y2="100" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Y-axis labels -->
  <text x="65" y="510" font-size="13" fill="#6b7280" text-anchor="end">0</text>
  <text x="65" y="410" font-size="13" fill="#6b7280" text-anchor="end">400</text>
  <text x="65" y="310" font-size="13" fill="#6b7280" text-anchor="end">800</text>
  <text x="65" y="210" font-size="13" fill="#6b7280" text-anchor="end">1.2K</text>
  <text x="65" y="110" font-size="13" fill="#6b7280" text-anchor="end">1.6K</text>

  <!-- Y-axis -->
  <line x1="80" y1="100" x2="80" y2="500" stroke="#374151" stroke-width="2"/>

  <!-- X-axis -->
  <line x1="80" y1="500" x2="1150" y2="500" stroke="#374151" stroke-width="2"/>

  <!-- 2023 Line (Blue) - Low contribution start -->
  <polyline points="130,480 280,470 430,460 580,455 730,450 880,445 1030,440" 
            stroke="url(#grad2023)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 2023 Data points -->
  <circle cx="130" cy="480" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <circle cx="580" cy="455" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>

  <!-- 2024 Line (Green) - Growth begins -->
  <polyline points="280,470 380,450 430,440 530,420 630,400 730,380 830,360 930,340 1030,320" 
            stroke="url(#grad2024)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 2024 Data points -->
  <circle cx="430" cy="440" r="6" fill="#059669" stroke="#ffffff" stroke-width="2"/>
  <circle cx="730" cy="380" r="6" fill="#059669" stroke="#ffffff" stroke-width="2"/>

  <!-- 2025 Line (Orange) - Acceleration -->
  <polyline points="430,440 530,360 630,280 730,220 830,160 930,120 1030,100" 
            stroke="url(#grad2025)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 2025 Data points -->
  <circle cx="730" cy="220" r="6" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
  <circle cx="1030" cy="100" r="6" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>

  <!-- 2026 Line (Red) - Rapid growth -->
  <polyline points="730,220 830,150 930,90 1030,50 1080,30" 
            stroke="url(#grad2026)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 2026 Data point with glow -->
  <circle cx="1080" cy="30" r="8" fill="#dc2626" stroke="#fca5a5" stroke-width="3" opacity="0.6"/>
  <circle cx="1080" cy="30" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>

  <!-- Year markers on X-axis -->
  <text x="180" y="540" font-size="16" font-weight="600" fill="#374151" text-anchor="middle">2023</text>
  <line x1="180" y1="500" x2="180" y2="510" stroke="#374151" stroke-width="2"/>

  <text x="580" y="540" font-size="16" font-weight="600" fill="#374151" text-anchor="middle">2024</text>
  <line x1="580" y1="500" x2="580" y2="510" stroke="#374151" stroke-width="2"/>

  <text x="980" y="540" font-size="16" font-weight="600" fill="#374151" text-anchor="middle">2025</text>
  <line x1="980" y1="500" x2="980" y2="510" stroke="#374151" stroke-width="2"/>

  <text x="1080" y="540" font-size="16" font-weight="600" fill="#374151" text-anchor="middle">2026</text>
  <line x1="1080" y1="500" x2="1080" y2="510" stroke="#374151" stroke-width="2"/>

  <!-- Legend -->
  <g>
    <!-- 2023 -->
    <circle cx="920" cy="565" r="5" fill="#2563eb"/>
    <text x="935" y="570" font-size="13" fill="#374151">2023</text>

    <!-- 2024 -->
    <circle cx="1020" cy="565" r="5" fill="#059669"/>
    <text x="1035" y="570" font-size="13" fill="#374151">2024</text>

    <!-- 2025 -->
    <circle cx="1110" cy="565" r="5" fill="#ea580c"/>
    <text x="1125" y="570" font-size="13" fill="#374151">2025</text>

    <!-- 2026 -->
    <circle cx="1200" cy="565" r="5" fill="#dc2626"/>
    <text x="1215" y="570" font-size="13" fill="#374151">2026</text>
  </g>

  <!-- Animation effect (optional - can be enhanced with CSS) -->
  <style>
    @keyframes pulse {
      0% { r: 6; opacity: 1; }
      50% { r: 8; opacity: 0.8; }
      100% { r: 6; opacity: 1; }
    }
  </style>
</svg>
