const dates = Object.keys(RAW).sort();
let cum = 0;
const points = dates.map(d => {
  cum += RAW[d];
  return { date: d, day: RAW[d], cum };
});
const total = cum;

const PALETTE = ['#58a6ff','#3fb950','#f778ba','#d29922','#a371f7','#39c5cf','#f85149','#56d4dd'];

const scrawls = [
  "505 commits deep and still says \"just one more fix\"",
  "August & May 2026: the two months Hariom forgot sleep exists",
  "proof that 'I'll commit tomorrow' was a lie, in the best way",
  "green squares: hariom's actual love language"
];
document.getElementById('scrawlText').textContent = scrawls[Math.floor(Math.random()*scrawls.length)];
document.getElementById('totalNum').textContent = total.toLocaleString();

// ---- layout ----
const W = 980, H = 380;
const padL = 54, padR = 26, padT = 24, padB = 46;
const plotW = W - padL - padR;
const plotH = H - padT - padB;
const n = points.length;
const yMax = Math.ceil(total / 100) * 100 + 50;

function x(i){ return padL + (plotW * i/(n-1)); }
function y(v){ return padT + plotH - (plotH * v/yMax); }

const svg = document.getElementById('chart');
const NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// gridlines + y labels
const steps = 5;
for(let s=0; s<=steps; s++){
  const v = (yMax/steps)*s;
  const gy = y(v);
  svg.appendChild(el('line', {x1:padL, y1:gy, x2:W-padR, y2:gy, class:'gridline'}));
  const t = el('text', {x:padL-10, y:gy+4, class:'tick', 'text-anchor':'end'});
  t.textContent = Math.round(v);
  svg.appendChild(t);
}

// month boundaries -> colored segments
let segStart = 0;
let curMonth = points[0].date.slice(0,7);
let colorIdx = 0;
const segments = [];
for(let i=1;i<=n;i++){
  const m = i<n ? points[i].date.slice(0,7) : null;
  if(m !== curMonth){
    segments.push({from:segStart, to:i-1, color: PALETTE[colorIdx % PALETTE.length], month: curMonth});
    colorIdx++;
    segStart = i-1;
    curMonth = m;
  }
}

const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

segments.forEach(seg => {
  let d = '';
  for(let i=seg.from; i<=seg.to; i++){
    const cmd = i===seg.from ? 'M' : 'L';
    d += `${cmd} ${x(i).toFixed(1)},${y(points[i].cum).toFixed(1)} `;
  }
  const glow = el('path', {d, fill:'none', stroke:seg.color, 'stroke-width':4, 'stroke-linecap':'round', opacity:0.35, filter:'blur(3px)'});
  const line = el('path', {d, fill:'none', stroke:seg.color, 'stroke-width':2.4, 'stroke-linecap':'round'});
  svg.appendChild(glow);
  svg.appendChild(line);
});

// end dot
const last = points[n-1];
svg.appendChild(el('circle', {cx:x(n-1), cy:y(last.cum), r:5, fill:'#0b0e14', stroke: segments[segments.length-1].color, 'stroke-width':3}));

// x labels: first of each quarter-ish
const labelIdx = [];
let lastMonthShown = '';
points.forEach((p,i) => {
  const m = p.date.slice(0,7);
  if(m !== lastMonthShown && (i===0 || i % 1 === 0)){
    lastMonthShown = m;
  }
});
[0, Math.floor(n*0.25), Math.floor(n*0.5), Math.floor(n*0.75), n-1].forEach(i => {
  const p = points[i];
  const [yr, mo] = p.date.split('-');
  const t = el('text', {x:x(i), y:H-14, class:'tick', 'text-anchor':'middle'});
  t.textContent = `${monthNames[parseInt(mo)-1]} ${yr}`;
  svg.appendChild(t);
});

// hover layer
const hoverDot = el('circle', {r:5, fill:'#fff', stroke:'#0b0e14', 'stroke-width':2, opacity:0});
svg.appendChild(hoverDot);
const hoverLine = el('line', {y1:padT, y2:H-padB, stroke:'#8b949e', 'stroke-width':1, 'stroke-dasharray':'3,3', opacity:0});
svg.insertBefore(hoverLine, hoverDot);

const hitRect = el('rect', {x:padL, y:padT, width:plotW, height:plotH, fill:'transparent'});
svg.appendChild(hitRect);

const tooltip = document.getElementById('tooltip');

function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
}

function nearestIndex(px){
  const ratio = (px - padL) / plotW;
  let i = Math.round(ratio * (n-1));
  return Math.max(0, Math.min(n-1, i));
}

svg.addEventListener('mousemove', (e) => {
  const rect = svg.getBoundingClientRect();
  const scaleX = W / rect.width;
  const px = (e.clientX - rect.left) * scaleX;
  const i = nearestIndex(px);
  const p = points[i];

  hoverDot.setAttribute('cx', x(i));
  hoverDot.setAttribute('cy', y(p.cum));
  hoverDot.setAttribute('opacity', 1);
  hoverLine.setAttribute('x1', x(i));
  hoverLine.setAttribute('x2', x(i));
  hoverLine.setAttribute('opacity', 1);

  const wrapRect = svg.parentElement.getBoundingClientRect();
  const tx = ((x(i)/W) * wrapRect.width);
  const ty = ((y(p.cum)/H) * wrapRect.height);

  tooltip.innerHTML = `<div class="d">${fmtDate(p.date)}</div>
    <div class="n">${p.day} contribution${p.day===1?'':'s'} that day</div>
    <div class="d">cumulative: ${p.cum.toLocaleString()}</div>`;
  tooltip.style.left = Math.min(wrapRect.width - 160, Math.max(4, tx + 12)) + 'px';
  tooltip.style.top = Math.max(4, ty - 54) + 'px';
  tooltip.style.opacity = 1;
});

svg.addEventListener('mouseleave', () => {
  hoverDot.setAttribute('opacity', 0);
  hoverLine.setAttribute('opacity', 0);
  tooltip.style.opacity = 0;
});

// legend
const legend = document.getElementById('legend');
const seen = new Set();
segments.forEach(seg => {
  if(seen.has(seg.month)) return;
  seen.add(seg.month);
  const [yr, mo] = seg.month.split('-');
  const sw = document.createElement('span');
  sw.className = 'sw';
  sw.innerHTML = `<i style="background:${seg.color}"></i>${monthNames[parseInt(mo)-1]} '${yr.slice(2)}`;
  legend.appendChild(sw);
});
</script>

</body>
</html>
