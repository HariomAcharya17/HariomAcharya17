<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="380" fill="#ffffff" />

  <text x="40" y="42" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">
    Hariom's GitHub contribution growth
  </text>
  <text x="860" y="42" font-family="Fira Code, monospace" font-size="16" font-weight="600" fill="#1a1a1a" text-anchor="end">
    1,504 total
  </text>

  <!-- gridlines -->
  <line x1="70" y1="290" x2="860" y2="290" stroke="#eef0f3" stroke-width="1" />
  <line x1="70" y1="230" x2="860" y2="230" stroke="#eef0f3" stroke-width="1" />
  <line x1="70" y1="170" x2="860" y2="170" stroke="#eef0f3" stroke-width="1" />
  <line x1="70" y1="110" x2="860" y2="110" stroke="#eef0f3" stroke-width="1" />
  <line x1="70" y1="70"  x2="860" y2="70"  stroke="#eef0f3" stroke-width="1" />

  <text x="55" y="294" font-family="Segoe UI, sans-serif" font-size="12" fill="#9aa1ab" text-anchor="end">0</text>
  <text x="55" y="234" font-family="Segoe UI, sans-serif" font-size="12" fill="#9aa1ab" text-anchor="end">400</text>
  <text x="55" y="174" font-family="Segoe UI, sans-serif" font-size="12" fill="#9aa1ab" text-anchor="end">800</text>
  <text x="55" y="114" font-family="Segoe UI, sans-serif" font-size="12" fill="#9aa1ab" text-anchor="end">1.2K</text>
  <text x="55" y="74"  font-family="Segoe UI, sans-serif" font-size="12" fill="#9aa1ab" text-anchor="end">1.6K</text>

  <!-- ===== 2023 segment — blue ===== -->
  <path d="M 70,286 C 130,284 160,282 190,280" fill="none" stroke="#4285F4" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 70,286 C 130,284 160,282 190,280" fill="none" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round" />

  <!-- ===== 2024 segment — green ===== -->
  <path d="M 190,280 C 230,278 260,272 335,258" fill="none" stroke="#34A853" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 190,280 C 230,278 260,272 335,258" fill="none" stroke="#34A853" stroke-width="2.5" stroke-linecap="round" />

  <!-- ===== 2025 segment — orange/yellow ===== -->
  <path d="M 335,258 C 390,220 430,192 460,168 C 500,138 540,124 595,116" fill="none" stroke="#FBBC05" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 335,258 C 390,220 430,192 460,168 C 500,138 540,124 595,116" fill="none" stroke="#FBBC05" stroke-width="2.5" stroke-linecap="round" />

  <!-- ===== 2026 segment — red/purple ===== -->
  <path d="M 595,116 C 650,104 700,90 750,68 C 790,52 820,44 860,38" fill="none" stroke="#EA4335" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 595,116 C 650,104 700,90 750,68 C 790,52 820,44 860,38" fill="none" stroke="#EA4335" stroke-width="2.5" stroke-linecap="round" />

  <!-- segment boundary dots -->
  <circle cx="190" cy="280" r="4" fill="#ffffff" stroke="#34A853" stroke-width="2.5" />
  <circle cx="335" cy="258" r="4" fill="#ffffff" stroke="#FBBC05" stroke-width="2.5" />
  <circle cx="595" cy="116" r="4" fill="#ffffff" stroke="#EA4335" stroke-width="2.5" />
  <circle cx="860" cy="38"  r="5" fill="#ffffff" stroke="#EA4335" stroke-width="3" filter="url(#glow)" />

  <!-- x axis labels -->
  <text x="70"  y="330" font-family="Segoe UI, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">2023</text>
  <text x="335" y="330" font-family="Segoe UI, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">2024</text>
  <text x="595" y="330" font-family="Segoe UI, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">2025</text>
  <text x="860" y="330" font-family="Segoe UI, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">2026</text>

  <!-- legend -->
  <g font-family="Segoe UI, sans-serif" font-size="12" fill="#6b7280">
    <circle cx="640" cy="360" r="4" fill="#4285F4" /><text x="650" y="364">2023</text>
    <circle cx="700" cy="360" r="4" fill="#34A853" /><text x="710" y="364">2024</text>
    <circle cx="760" cy="360" r="4" fill="#FBBC05" /><text x="770" y="364">2025</text>
    <circle cx="820" cy="360" r="4" fill="#EA4335" /><text x="830" y="364">2026</text>
  </g>
</svg>
