<svg width="800" height="380" viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" style="background:#090d16; border-radius:16px;">
  <defs>
    <filter id="cityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="cyanRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <linearGradient id="purpleRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="coralRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb6" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <path d="M 0,200 L 400,380 L 800,200 L 400,20 Z" fill="none" />
    <path d="M 100,150 L 500,330 M 200,100 L 600,280 M 300,50 L 700,230" />
    <path d="M 700,150 L 300,330 M 600,100 L 200,280 M 500,50 L 100,230" />
  </g>

  <g filter="url(#cityGlow)">
    <path d="M 50,225 L 400,380 L 750,205" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.8" stroke-dasharray="15 30">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M 720,180 L 400,320 L 80,180" fill="none" stroke="#ff007f" stroke-width="2" opacity="0.8" stroke-dasharray="20 40">
      <animate attributeName="stroke-dashoffset" from="0" to="120" dur="2.5s" repeatCount="indefinite" />
    </path>
  </g>

  <g filter="url(#cityGlow)">
    <polygon points="260,160 300,140 340,160 300,180" fill="url(#cyanRoof)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
    </polygon>
    <polygon points="260,160 300,180 300,290 260,270" fill="#0369a1" opacity="0.85" />
    <polygon points="300,180 340,160 340,270 300,290" fill="#0c4a6e" opacity="0.9" />
    <line x1="320" y1="175" x2="320" y2="275" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="4 8">
      <animate attributeName="stroke-dashoffset" from="0" to="24" dur="1.5s" repeatCount="indefinite" />
    </line>
  </g>

  <g filter="url(#cityGlow)">
    <polygon points="370,100 420,75 470,100 420,125" fill="url(#purpleRoof)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite" />
    </polygon>
    <polygon points="370,100 420,125 420,310 370,285" fill="#6b21a8" opacity="0.85" />
    <polygon points="420,125 470,100 470,285 420,310" fill="#4c1d95" opacity="0.9" />
    <line x1="420" y1="75" x2="420" y2="25" stroke="#a855f7" stroke-width="3" opacity="0.9" />
    <circle cx="420" cy="25" r="4" fill="#f0abfc">
      <animate attributeName="r" values="3;7;3" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <g filter="url(#cityGlow)">
    <polygon points="490,170 530,150 570,170 530,190" fill="url(#coralRoof)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite" />
    </polygon>
    <polygon points="490,170 530,190 530,280 490,260" fill="#9f1239" opacity="0.85" />
    <polygon points="530,190 570,170 570,260 530,280" fill="#881337" opacity="0.9" />
    <line x1="510" y1="185" x2="510" y2="265" stroke="#fda4af" stroke-width="2" stroke-dasharray="3 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="2s" repeatCount="indefinite" />
    </line>
  </g>

  <g opacity="0.4">
    <circle cx="150" cy="70" r="1.5" fill="#38bdf8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" /></circle>
    <circle cx="280" cy="40" r="2" fill="#c084fc"><animate attributeName="opacity" values="1;0.2;1" dur="1.7s" repeatCount="indefinite" /></circle>
    <circle cx="620" cy="80" r="1.5" fill="#ff7eb6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.3s" repeatCount="indefinite" /></circle>
    <circle cx="710" cy="50" r="2" fill="#38bdf8"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.9s" repeatCount="indefinite" /></circle>
  </g>

  <text x="400" y="355" text-anchor="middle" font-family="Fira Code, monospace" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="3">
    CITY LIGHTS • 3D ARCHITECTURE
  </text>
</svg>
